<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotakEngine App Core</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1b26; /* Sladěno s tmavým tématem indexu */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #9ece6a; /* Zelená barva jádra */
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.1rem;
            color: #a9b1d6;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KotakEngine Dashboard 🚀</h1>
        <p>Vítej uvnitř běžící chráněné aplikace.</p>
        <p style="font-size: 0.9rem; margin-top: 10px; color: #565f89;">Tento obsah se načítá izolovaně přes iFrame.</p>
    </div>

</body>
</html>
