<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KotakEngine - Karty</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f1014; --card-bg: #1c1e26; --accent: #007aff; --text: #ffffff;
            --danger: #ff3b30; --separator: #2c2e3a; --nav-bg: #16181f; --green: #34c759;
        }
        body, html { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100%; overflow: hidden; }

        /* FORCE UPDATE POP-UP */
        #force-update-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: none; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }
        .update-modal {
            background: #1c1e26; border-radius: 25px; padding: 30px;
            width: 100%; max-width: 300px; text-align: center;
            border: 1px solid var(--separator); box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .btn-update { display: block; background: var(--green); color: white; padding: 16px; border-radius: 15px; text-decoration: none; font-weight: 800; margin-top: 25px; font-size: 16px; }

        /* VIEWPORT */
        .viewport {
            display: flex; width: 200vw;
            height: calc(100% - 70px - env(safe-area-inset-top, 20px));
            margin-top: env(safe-area-inset-top, 20px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page { width: 100vw; height: 100%; padding: 10px 20px; box-sizing: border-box; overflow-y: auto; position: relative; }
        h1 { font-size: 26px; margin: 5px 0 15px 0; font-weight: 700; }

        /* DESIGN BUBBLÍ (2 sloupce, vajíčkový tvar) */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            position: relative; 
        }
        .tile { 
            background: #131722; 
            height: 110px; 
            border-radius: 55px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: 10px; 
            border: 1px solid #1c2030; 
            user-select: none;
            touch-action: none;
            position: relative;
            z-index: 1;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        
        .tile.dragging {
            z-index: 1000;
            background: #1c2132;
            border-color: var(--accent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        .tile-icon { 
            width: 45px; 
            height: 45px; 
            background: var(--accent); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: bold; 
            color: #fff;
            margin-bottom: 8px;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.3);
        }
        .tile-name { 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            color: #8f9cae; 
            text-align: center;
            width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* NAVIGACE */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--nav-bg); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 500; padding-bottom: env(safe-area-inset-bottom, 0); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #555; font-size: 20px; cursor: pointer; }
        .nav-item.active-blue { color: var(--accent); }
        .nav-item.active-green { color: var(--green); }

        /* MODÁLY */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1500; }
        .sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #1c1e26; border-radius: 25px 25px 0 0; padding: 25px 20px calc(40px + env(safe-area-inset-bottom, 0)) 20px; box-sizing: border-box; transition: bottom 0.3s ease-in-out; z-index: 1600; }
        .sheet.active { bottom: 0; }
        .input-box { width: 100%; padding: 18px; margin: 8px 0; background: #2c2e3a; border: none; border-radius: 12px; color: white; font-size: 16px; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; width: 100%; }

        /* DETAIL */
        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; color: black; z-index: 2000; display: none; flex-direction: column; opacity: 0; transition: all 0.4s; padding-top: calc(env(safe-area-inset-top, 20px) + 5px); }
        #detail-view.active { opacity: 1; display: flex; }
        #barcode-container, #qrcode { width: 100%; display: flex; justify-content: center; align-items: center; padding: 20px 0; }
        .card-number-display { margin-top: 10px; font-family: monospace; font-size: 22px; font-weight: bold; color: #333; text-align: center; }

        /* NÁKUPNÍ SEZNAM STYLY */
        .add-todo-btn { background: var(--green); border: none; border-radius: 12px; color: white; padding: 0 25px; font-weight: bold; font-size: 24px; height: 55px; }
        .todo-input-wrap { display: flex; gap: 8px; align-items: center; }
        .todo-input-wrap .input-box { margin: 0; height: 55px; }
    </style>
</head>
<body>

<div id="force-update-overlay">
    <div class="update-modal">
        <span style="font-size:50px; display:block; margin-bottom:15px;">🚀</span>
        <h2 style="margin:0; font-size: 22px;">Aktualizace nutná</h2>
        <p style="color:#aaa; margin-top:12px; font-size: 14px; line-height: 1.4;">K dispozici je nová verze KotakEngine. Pro pokračování prosím aktualizujte.</p>
        <a id="update-link" href="#" class="btn-update">AKTUALIZOVAT</a>
    </div>
</div>

<div id="viewport" class="viewport">
    <div class="page">
        <h1>Nákupní seznam</h1>
        <div class="todo-input-wrap">
            <input type="text" id="todoInput" class="input-box" placeholder="Co koupit?">
            <button onclick="addTodo()" class="add-todo-btn">+</button>
        </div>
        <div id="todoList" style="margin-top:20px;"></div>
    </div>

    <div class="page">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <h1>Přehled</h1>
            <div id="syncLabel" onclick="openSync()" style="color:var(--accent); font-weight:bold; font-size: 11px; padding: 5px; text-transform: uppercase;">KÓD: -----</div>
        </div>
        <div id="card-grid" class="grid"></div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item" id="nav-list" onclick="switchPage(0)">🛒</div>
    <div class="nav-item" onclick="openAddCard()">➕</div>
    <div class="nav-item active-blue" id="nav-cards" onclick="switchPage(1)">💳</div>
</nav>

<div id="overlay" onclick="closeAll()"></div>

<div id="sync-sheet" class="sheet">
    <h2 style="margin-top:0">Změnit místnost</h2>
    <input type="number" id="syncInput" class="input-box" placeholder="Zadej 5 čísel místnosti">
    <div style="display: flex; gap: 10px;">
        <button onclick="initSyncManual()" class="input-box btn-main" style="flex:1;">PŘIPOJIT</button>
        <button onclick="leaveSync()" class="input-box" style="background:#333; color:white; flex:1;">ODPOJIT</button>
    </div>
</div>

<div id="add-sheet" class="sheet">
    <h2 style="margin-top:0">Nová karta</h2>
    <input type="text" id="cardName" class="input-box" placeholder="Obchod">
    <input type="text" id="cardCode" class="input-box" placeholder="Číslo karty">
    <div style="display:flex; align-items:center; justify-content:space-between; background:#2c2e3a; padding:12px; border-radius:12px; margin:5px 0;">
        <span style="color:#aaa; font-size:14px;">Použít QR kód</span>
        <input type="checkbox" id="isQrToggle" style="width:20px; height:20px;">
    </div>
    <button onclick="saveCard()" class="input-box btn-main" style="margin-top:10px;">ULOŽIT KARTU</button>
</div>

<div id="detail-view">
    <div style="display: flex; justify-content: space-between; padding: 20px 20px; align-items: center;">
        <div onclick="hideDetail()" style="font-size: 24px;">✕</div>
        <div id="det-name" style="font-weight: 800; text-transform: uppercase;">NÁZEV</div>
        <div onclick="deleteCard()" style="color: red; font-weight: bold;">SMAZAT</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 20px;">
        <div id="barcode-container"><svg id="barcode"></svg></div>
        <div id="qrcode"></div>
        <div id="det-number" class="card-number-display"></div>
    </div>
</div>

<script>
    const currentAppVersion = 1;

    const firebaseConfig = {
        apiKey: "AIzaSyAGx6NDM6dqQzTwbhwDB1BhFnfjmepuLnE",
        authDomain: "kotakengine-multi-app.firebaseapp.com",
        databaseURL: "https://kotakengine-multi-app-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kotakengine-multi-app",
        storageBucket: "kotakengine-multi-app.firebasestorage.app",
        messagingSenderId: "692935167232",
        appId: "1:692935167232:web:55ff99266dd5b230ca37e5",
        measurementId: "G-TGVH1SWPPR"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('app_config').on('value', snap => {
        const config = snap.val();
        const overlay = document.getElementById('force-update-overlay');
        if (config && config.forceUpdate === true && currentAppVersion < config.minVersion) {
            overlay.style.display = 'flex';
            document.getElementById('update-link').href = config.updateUrl || config.path || "#";
        } else {
            overlay.style.display = 'none';
        }
    });

    let cards = [], todos = [], cardsRef = null, todosRef = null, userRoomRef = null, currentIdx = null, uName = "";
    
    // Obsluha Drag & Drop
    let dragEl = null, startX = 0, startY = 0, initialIndex = null, isPressing = false, pressTimeout = null;

    function checkUserAuthentication() {
        const savedUser = localStorage.getItem('kotak_user');
        if (!savedUser) {
            alert("Uživatel není přihlášen! Přesměrovávám na hlavní stránku...");
            window.location.href = "app.html";
            return false;
        }
        
        try {
            const parsedData = JSON.parse(savedUser);
            uName = parsedData.username;
        } catch(e) {
            alert("Chyba při čtení dat uživatele. Přesměrovávám...");
            window.location.href = "app.html";
            return false;
        }

        if (!uName) {
            window.location.href = "app.html";
            return false;
        }
        
        uName = uName.trim().toLowerCase().replace(/\s+/g, '');
        return true;
    }

    function initUserRoomListener() {
        if (!uName) return;
        
        // Vypnutí případného starého listeneru
        if (userRoomRef) userRoomRef.off();
        
        // ŽIVÝ POSLECH: Sleduje změnu přidělené místnosti u daného uživatele v reálném čase
        userRoomRef = db.ref('users/' + uName + '/cards');
        userRoomRef.on('value', snap => {
            const assignedRoom = snap.val();
            if (assignedRoom) {
                const currentLocalRoom = localStorage.getItem('room');
                // Pokud se zapsaná místnost v DB liší od té lokální, live přepneme streamy dat
                if (assignedRoom.toString() !== currentLocalRoom) {
                    startSync(assignedRoom.toString(), false); // false = nezapisovat znovu zpět do DB, jen přepnout stream
                }
            } else {
                // Pokud uživatel místnost nemá, vygenerujeme novou a zapíšeme ji
                const defaultRoom = Math.floor(10000 + Math.random() * 90000).toString();
                startSync(defaultRoom, true);
            }
        });
    }

    function initSyncManual() {
        const code = document.getElementById('syncInput').value;
        if (code.length !== 5) return alert("Zadej 5 čísel!");
        startSync(code, true); // Zde uživatel mění místnost ručně, chceme zápis do DB
        closeAll();
    }

    function startSync(code, writeToDatabase = true) {
        localStorage.setItem('room', code);

        if(cardsRef) cardsRef.off();
        if(todosRef) todosRef.off();

        // Pokud je vyžadován zápis do DB a máme uživatelské jméno
        if (writeToDatabase && uName) {
            db.ref('users/' + uName + '/cards').set(code);
        }

        cardsRef = db.ref('cards/' + code);
        todosRef = db.ref('todos/' + code);

        cardsRef.on('value', snap => {
            if (dragEl) return; 
            
            const data = snap.val() || {};
            cards = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            })).sort((a, b) => a.position - b.position);
            
            document.getElementById('syncLabel').innerText = "KÓD: " + code;
            renderCards();
        });

        todosRef.on('value', snap => {
            const data = snap.val() || {};
            todos = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));
            renderTodos();
        });
    }

    function leaveSync() { 
        if (uName) {
            db.ref('users/' + uName + '/cards').remove();
        }
        localStorage.removeItem('room');
        location.reload(); 
    }

    function saveCard() {
        const n = document.getElementById('cardName').value;
        const c = document.getElementById('cardCode').value;
        const q = document.getElementById('isQrToggle').checked;
        if(!n || !c) return;

        const cardType = q ? "qrcode" : "barcode";
        const nextPosition = cards.length;

        if(cardsRef) {
            cardsRef.push({
                name: n,
                code: c,
                type: cardType,
                position: nextPosition
            });
        } else {
            cards.push({ name: n, code: c, type: cardType, position: nextPosition });
            renderCards();
        }

        document.getElementById('cardName').value = '';
        document.getElementById('cardCode').value = '';
        document.getElementById('isQrToggle').checked = false;
        closeAll();
    }

    function addTodo() {
        const i = document.getElementById('todoInput'); if(!i.value) return;
        
        if(todosRef) {
            todosRef.push({ text: i.value, checked: false });
        } else {
            todos.push({ text: i.value, checked: false });
            renderTodos();
        }
        i.value = '';
    }

    function toggleTodo(idx) {
        const item = todos[idx];
        const newChecked = !item.checked;
        if(todosRef && item.id) {
            todosRef.child(item.id).update({ checked: newChecked });
        } else {
            todos[idx].checked = newChecked;
            renderTodos();
        }
    }

    function deleteTodo(idx) {
        const item = todos[idx];
        if(todosRef && item.id) {
            todosRef.child(item.id).remove();
        } else {
            todos.splice(idx, 1);
            renderTodos();
        }
    }

    function deleteCard() {
        const card = cards[currentIdx];
        if(cardsRef && card.id) {
            cardsRef.child(card.id).remove();
            setTimeout(reindexAndSaveCards, 500);
        } else {
            cards.splice(currentIdx, 1);
            renderCards();
        }
        hideDetail();
    }

    function renderCards() {
        const g = document.getElementById('card-grid'); g.innerHTML = '';
        cards.forEach((c, i) => {
            g.innerHTML += `
                <div class="tile" 
                     data-index="${i}"
                     ontouchstart="handleTouchStart(event, ${i})"
                     ontouchmove="handleTouchMove(event)"
                     ontouchend="handleTouchEnd(event)">
                    <div class="tile-icon">${c.name[0]}</div>
                    <div class="tile-name">${c.name}</div>
                </div>`;
        });
    }

    /* DRAG & DROP LOGIKA */
    function handleTouchStart(e, index) {
        isPressing = true;
        initialIndex = index;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        const el = e.currentTarget;
        
        pressTimeout = setTimeout(() => {
            if (!isPressing) return;
            dragEl = el;
            dragEl.classList.add('dragging');
            if (window.navigator.vibrate) window.navigator.vibrate(40);
        }, 400);
    }

    function handleTouchMove(e) {
        if (!dragEl) {
            isPressing = false;
            clearTimeout(pressTimeout);
            return;
        }
        
        e.preventDefault();
        const touch = e.touches[0];
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        
        dragEl.style.transform = `translate(` + deltaX + `px, ` + deltaY + `px) scale(1.05)`;

        const grid = document.getElementById('card-grid');
        const siblingTiles = [...grid.querySelectorAll('.tile:not(.dragging)')];
        
        let targetSibling = siblingTiles.find(sibling => {
            const rect = sibling.getBoundingClientRect();
            return touch.clientX >= rect.left && touch.clientX <= rect.right &&
                   touch.clientY >= rect.top && touch.clientY <= rect.bottom;
        });

        if (targetSibling) {
            const dragIdx = cards[parseInt(dragEl.getAttribute('data-index'))].position;
            const targetIdx = cards[parseInt(targetSibling.getAttribute('data-index'))].position;
            
            if (dragIdx < targetIdx) {
                grid.insertBefore(dragEl, targetSibling.nextSibling);
            } else {
                grid.insertBefore(dragEl, targetSibling);
            }
        }
    }

    function handleTouchEnd(e) {
        isPressing = false;
        clearTimeout(pressTimeout);

        if (!dragEl) {
            if (initialIndex !== null) {
                showDetail(initialIndex);
            }
            return;
        }

        dragEl.classList.remove('dragging');
        dragEl.style.transform = '';
        
        const grid = document.getElementById('card-grid');
        const currentElements = [...grid.querySelectorAll('.tile')];
        
        let newOrderedCards = [];
        currentElements.forEach((el, newPosition) => {
            const oldIdx = parseInt(el.getAttribute('data-index'));
            let cardData = cards[oldIdx];
            cardData.position = newPosition;
            newOrderedCards.push(cardData);
        });

        cards = newOrderedCards;
        dragEl = null;
        initialIndex = null;

        renderCards();
        reindexAndSaveCards();
    }

    function reindexAndSaveCards() {
        if (!cardsRef) return;
        
        let updates = {};
        cards.forEach((card) => {
            if(card.id) {
                updates[card.id + '/name'] = card.name;
                updates[card.id + '/code'] = card.code;
                updates[card.id + '/type'] = card.type;
                updates[card.id + '/position'] = card.position;
            }
        });
        
        db.ref('cards/' + localStorage.getItem('room')).update(updates);
    }

    function renderTodos() {
        const l = document.getElementById('todoList'); l.innerHTML = '';
        todos.forEach((t, i) => {
            l.innerHTML += `<div style="display:flex; align-items:center; padding:15px 0; border-bottom:1px solid #222;"><input type="checkbox" onchange="toggleTodo(${i})" ${t.checked ? 'checked' : ''} style="width:20px; height:20px; margin-right:12px;"><span style="flex:1; ${t.checked ? 'text-decoration:line-through; color:#555' : ''}">${t.text}</span><div onclick="deleteTodo(${i})" style="color:#444; padding:5px">✕</div></div>`;
        });
    }

    function showDetail(i) {
        currentIdx = i; const c = cards[i]; const dv = document.getElementById('detail-view');
        dv.style.display = 'flex'; document.getElementById('det-name').innerText = c.name;
        document.getElementById('det-number').innerText = c.code;
        const bcContainer = document.getElementById('barcode-container'), qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        
        if(c.type === "qrcode") { 
            bcContainer.style.display = 'none'; qrContainer.style.display = 'flex'; 
            new QRCode(qrContainer, {text: c.code, width: 250, height: 250}); 
        } else {
            bcContainer.style.display = 'flex'; qrContainer.style.display = 'none';
            let barWidth = c.code.length > 12 ? 1.7 : 2.5;
            if(c.code.length > 18) barWidth = 1.3;
            JsBarcode("#barcode", c.code.replace(/\s/g, ''), { format: "CODE128", width: barWidth, height: 120, displayValue: false });
        }
        setTimeout(() => dv.classList.add('active'), 10);
    }

    function hideDetail() { document.getElementById('detail-view').classList.remove('active'); setTimeout(() => document.getElementById('detail-view').style.display = 'none', 400); }
    
    function switchPage(idx) {
        document.getElementById('viewport').style.transform = `translateX(-${idx * 100}vw)`;
        const nL = document.getElementById('nav-list'), nC = document.getElementById('nav-cards');
        if(idx === 0) { nL.classList.add('active-green'); nC.classList.remove('active-blue'); }
        else { nC.classList.add('active-blue'); nL.classList.remove('active-green'); }
    }
    
    function closeAll() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('active')); document.getElementById('overlay').style.display = 'none'; }
    function openAddCard() { document.getElementById('overlay').style.display = 'block'; document.getElementById('add-sheet').classList.add('active'); }
    function openSync() { document.getElementById('overlay').style.display = 'block'; document.getElementById('sync-sheet').classList.add('active'); }

    window.onload = () => {
        if (checkUserAuthentication()) {
            // Spustíme reaktivní poslech na změnu místnosti z DB u daného uživatele
            initUserRoomListener();
        }
        switchPage(1);
    }
</script>
</body>
</html>
