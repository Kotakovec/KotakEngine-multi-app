<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KotakEngine - Karty</title>
    <meta name="color-scheme" content="dark">
    <meta name="android-color-scheme" content="dark">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

        :root {
            --bg: #080a0f;
            --card-bg: #111318;
            --surface: #161a23;
            --surface2: #1e2330;
            --accent: #4f8eff;
            --accent-glow: rgba(79,142,255,0.18);
            --accent-dim: rgba(79,142,255,0.08);
            --text: #f0f2ff;
            --text-muted: #5a6078;
            --text-soft: #8892aa;
            --danger: #ff4757;
            --green: #2ed573;
            --green-glow: rgba(46,213,115,0.15);
            --separator: #1c2030;
            --nav-bg: #0d0f16;
            --border: #1e2335;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100%; overflow: hidden;
        }

        /* FORCE UPDATE */
        #force-update-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 10000;
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .update-modal {
            background: var(--surface); border-radius: 28px; padding: 32px;
            width: 100%; max-width: 300px; text-align: center;
            border: 1px solid var(--border);
        }
        .btn-update { display: block; background: var(--green); color: #000; padding: 16px; border-radius: 14px; text-decoration: none; font-weight: 800; margin-top: 25px; font-size: 15px; letter-spacing: 0.5px; }

        /* VIEWPORT */
        .viewport {
            display: flex; width: 100vw;
            height: calc(100% - 70px - env(safe-area-inset-top, 20px));
            margin-top: env(safe-area-inset-top, 20px);
        }
        .page { width: 100vw; height: 100%; padding: 16px 20px; overflow-y: auto; position: relative; }
        h1 { font-size: 26px; margin: 5px 0 18px 0; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }

        /* GRID KARET */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .tile {
            background: var(--surface);
            height: 110px;
            border-radius: 55px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 10px;
            border: 1px solid var(--border);
            user-select: none; touch-action: none;
            position: relative; z-index: 1;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .tile.dragging {
            z-index: 1000; background: var(--surface2);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(79,142,255,0.25);
            transform: scale(1.05); opacity: 0.92;
        }
        .tile-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent) 0%, #7b5cff 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: 800; color: #fff;
            margin-bottom: 8px; flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(79,142,255,0.3);
        }
        .tile-name {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-soft); text-align: center;
            width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* NAVIGACE */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 500; padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: color 0.2s; }
        .nav-item.active-blue { color: var(--accent); }
        .nav-item.active-green { color: var(--green); }

        /* OVERLAY & SHEET */
        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1500;
            backdrop-filter: blur(4px);
        }
        .sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: var(--surface);
            border-radius: 28px 28px 0 0;
            padding: 8px 20px calc(36px + env(safe-area-inset-bottom, 0)) 20px;
            transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1600;
            border: 1px solid var(--border);
            border-bottom: none;
        }
        .sheet.active { bottom: 0; }

        .sheet-handle {
            width: 36px; height: 4px;
            background: var(--surface2);
            border-radius: 2px;
            margin: 8px auto 20px auto;
        }
        .sheet h2 { margin: 0 0 18px 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }

        /* INPUTS */
        .input-box {
            width: 100%; padding: 16px 18px;
            margin: 6px 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text); font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .input-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .input-box::placeholder { color: var(--text-muted); }

        /* NOVÁ KARTA MODAL - přepracovaný layout */
        .card-form-group { display: flex; flex-direction: column; gap: 6px; }
        
        .code-row { display: flex; gap: 8px; align-items: center; }
        .code-row .input-box { flex: 1; margin: 0; }
        
        .scan-btn {
            width: 52px; height: 52px; flex-shrink: 0;
            background: var(--accent-dim);
            border: 1px solid rgba(79,142,255,0.3);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            font-size: 22px;
        }
        .scan-btn:active { background: var(--accent-glow); transform: scale(0.95); }

        .toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 14px; margin: 6px 0;
        }
        .toggle-label { color: var(--text-soft); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .toggle-label span { font-size: 16px; }

        /* Custom toggle switch */
        .toggle-switch { position: relative; width: 48px; height: 28px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 34px; transition: 0.3s;
        }
        .toggle-slider:before {
            content: ""; position: absolute;
            width: 20px; height: 20px;
            left: 3px; bottom: 3px;
            background: var(--text-muted);
            border-radius: 50%; transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); background: #fff; }

        .btn-main {
            background: linear-gradient(135deg, var(--accent) 0%, #7b5cff 100%);
            color: white; font-weight: 700; font-size: 15px;
            border: none; cursor: pointer; letter-spacing: 0.3px;
            border-radius: 14px; padding: 17px;
            margin-top: 8px; transition: opacity 0.2s, transform 0.1s;
        }
        .btn-main:active { opacity: 0.85; transform: scale(0.98); }

        /* KAMERA SKENER */
        #scanner-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 3000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #scanner-modal.active { display: flex; }
        #scanner-video {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0;
        }
        .scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .scanner-frame {
            width: 240px; height: 160px;
            border: 2.5px solid var(--accent);
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.55), 0 0 30px rgba(79,142,255,0.4);
            position: relative;
        }
        .scanner-frame::before, .scanner-frame::after {
            content: ''; position: absolute;
            width: 24px; height: 24px;
        }
        .scanner-line {
            position: absolute; top: 0; left: 0; right: 0;
            height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scanLine 2s ease-in-out infinite;
        }
        @keyframes scanLine {
            0% { top: 0; opacity: 1; }
            90% { top: calc(100% - 2px); opacity: 1; }
            100% { top: calc(100% - 2px); opacity: 0; }
        }
        .scanner-label {
            position: absolute; bottom: -36px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 600;
            white-space: nowrap; letter-spacing: 0.5px;
        }
        .scanner-close {
            position: absolute; top: calc(env(safe-area-inset-top, 20px) + 16px); right: 20px;
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; z-index: 10;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
        }
        .scanner-type-detected {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 20px) + 30px);
            background: rgba(79,142,255,0.9);
            color: white; font-weight: 700; font-size: 13px;
            padding: 10px 20px; border-radius: 30px;
            letter-spacing: 0.5px; opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(8px);
        }
        .scanner-type-detected.show { opacity: 1; }

        /* DETAIL KARTY */
        #detail-view {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; color: #000; z-index: 2000;
            display: none; flex-direction: column;
            opacity: 0; transition: opacity 0.35s;
            padding-top: calc(env(safe-area-inset-top, 20px) + 5px);
        }
        #detail-view.active { opacity: 1; display: flex; }
        #det-name { color: #000 !important; font-weight: 800; text-transform: uppercase; font-size: 15px; letter-spacing: 0.5px; }
        #barcode-container, #qrcode { width: 100%; display: flex; justify-content: center; align-items: center; padding: 20px 0; }
        .card-number-display {
            margin-top: 8px; font-family: 'DM Mono', monospace;
            font-size: 20px; font-weight: 500; color: #333 !important;
            text-align: center; letter-spacing: 2px;
        }



        /* SYNC LABEL */
        #syncLabel {
            color: var(--accent); font-weight: 700; font-size: 11px;
            padding: 6px 12px; background: var(--accent-dim);
            border-radius: 20px; cursor: pointer; letter-spacing: 0.5px;
            border: 1px solid rgba(79,142,255,0.2); transition: background 0.2s;
        }
        #syncLabel:active { background: var(--accent-glow); }
    </style>
</head>
<body>

<div id="force-update-overlay">
    <div class="update-modal">
        <span style="font-size:50px; display:block; margin-bottom:15px;">🚀</span>
        <h2 style="margin:0; font-size: 22px;">Aktualizace nutná</h2>
        <p style="color:#aaa; margin-top:12px; font-size: 14px; line-height: 1.5;">K dispozici je nová verze KotakEngine. Pro pokračování prosím aktualizujte.</p>
        <a id="update-link" href="#" class="btn-update">AKTUALIZOVAT</a>
    </div>
</div>

<div id="viewport" class="viewport">
    <!-- STRÁNKA: Přehled karet -->
    <div class="page">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
            <h1 style="margin:0;">Přehled</h1>
            <div id="syncLabel" onclick="openSync()">KÓD: -----</div>
        </div>
        <div id="card-grid" class="grid"></div>
    </div>
</div>

<!-- NAVIGACE -->
<nav class="nav-bar">
    <div class="nav-item" onclick="openAddCard()">➕</div>
</nav>

<div id="overlay" onclick="closeAll()"></div>

<!-- SYNC SHEET -->
<div id="sync-sheet" class="sheet">
    <div class="sheet-handle"></div>
    <h2>Změnit místnost</h2>
    <input type="number" id="syncInput" class="input-box" placeholder="Zadej 5 čísel místnosti">
    <div style="display: flex; gap: 10px; margin-top: 4px;">
        <button onclick="initSyncManual()" class="btn-main" style="flex:1;">PŘIPOJIT</button>
        <button onclick="leaveSync()" class="input-box" style="background:var(--surface2); color:var(--text-soft); flex:1; cursor:pointer; margin:0; font-weight:600;">ODPOJIT</button>
    </div>
</div>

<!-- ADD CARD SHEET -->
<div id="add-sheet" class="sheet">
    <div class="sheet-handle"></div>
    <h2>Nová karta</h2>
    <div class="card-form-group">
        <input type="text" id="cardName" class="input-box" placeholder="Název obchodu">
        
        <div class="code-row">
            <input type="text" id="cardCode" class="input-box" placeholder="Číslo / kód karty">
            <div class="scan-btn" onclick="openScanner()" title="Naskenovat kód">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                    <line x1="7" y1="12" x2="17" y2="12" stroke-width="2.5"/>
                    <line x1="12" y1="7" x2="12" y2="17" stroke-width="1.5" stroke-dasharray="2 2"/>
                </svg>
            </div>
        </div>

        <div class="toggle-row">
            <div class="toggle-label">
                <span>⬛</span>
                <span>QR kód</span>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="isQrToggle">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <button onclick="saveCard()" class="btn-main">ULOŽIT KARTU</button>
    </div>
</div>

<!-- DETAIL KARTY -->
<div id="detail-view">
    <div style="display: flex; justify-content: space-between; padding: 16px 20px; align-items: center; border-bottom: 1px solid #eee;">
        <div onclick="hideDetail()" style="font-size: 22px; cursor: pointer; padding: 4px;">✕</div>
        <div id="det-name">NÁZEV</div>
        <div onclick="deleteCard()" style="color: #ff3b30; font-weight: 700; cursor: pointer; font-size: 14px;">SMAZAT</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; padding: 20px;">
        <div id="barcode-container"><svg id="barcode"></svg></div>
        <div id="qrcode"></div>
        <div id="det-number" class="card-number-display"></div>
    </div>
</div>

<!-- SKENER MODÁL -->
<div id="scanner-modal">
    <video id="scanner-video" autoplay playsinline muted></video>
    <div class="scanner-overlay">
        <div class="scanner-frame">
            <div class="scanner-line"></div>
            <div class="scanner-label">NAMIŘTE NA KÓD</div>
        </div>
    </div>
    <div class="scanner-close" onclick="closeScanner()">✕</div>
    <div id="scanner-result" class="scanner-type-detected"></div>
</div>

<script>
    const currentAppVersion = 1;
    const firebaseConfig = {
        apiKey: "AIzaSyAGx6NDM6dqQzTwbhwDB1BhFnfjmepuLnE",
        authDomain: "kotakengine-multi-app.firebaseapp.com",
        databaseURL: "https://kotakengine-multi-app-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kotakengine-multi-app",
        storageBucket: "kotakengine-multi-app.firebasestorage.app",
        messagingSenderId: "692935167232",
        appId: "1:692935167232:web:55ff99266dd5b230ca37e5",
        measurementId: "G-TGVH1SWPPR"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('app_config').on('value', snap => {
        const config = snap.val();
        const overlay = document.getElementById('force-update-overlay');
        if (config && config.forceUpdate === true && currentAppVersion < config.minVersion) {
            overlay.style.display = 'flex';
            document.getElementById('update-link').href = config.updateUrl || config.path || "#";
        } else {
            overlay.style.display = 'none';
        }
    });

    let cards = [], cardsRef = null, todosRef = null, userRoomRef = null, currentIdx = null, uName = "";
    let dragEl = null, startX = 0, startY = 0, initialIndex = null, isPressing = false, pressTimeout = null;

    // ========================
    // SKENER
    // ========================
    let scannerStream = null, scannerInterval = null;

    async function openScanner() {
        const modal = document.getElementById('scanner-modal');
        const video = document.getElementById('scanner-video');
        const resultEl = document.getElementById('scanner-result');
        resultEl.classList.remove('show');

        try {
            scannerStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = scannerStream;
            modal.style.display = 'flex';
            startDetection(video);
        } catch(e) {
            alert('Nepodařilo se otevřít kameru. Zkontrolujte oprávnění.');
        }
    }

    function startDetection(video) {
        // Zkusíme BarcodeDetector API (nativní Chrome/Android)
        if ('BarcodeDetector' in window) {
            const detector = new BarcodeDetector({
                formats: ['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar','code_93','data_matrix','pdf417','aztec']
            });

            scannerInterval = setInterval(async () => {
                if (!scannerStream) return;
                try {
                    const barcodes = await detector.detect(video);
                    if (barcodes.length > 0) {
                        const bc = barcodes[0];
                        handleScannedCode(bc.rawValue, bc.format);
                    }
                } catch(e) {}
            }, 300);
        } else {
            // Fallback: canvas + ZXing-like scan přes jsbarcode (jen zobrazíme info)
            showScannerFallback();
        }
    }

    function handleScannedCode(value, format) {
        clearInterval(scannerInterval);
        const isQr = format === 'qr_code' || format === 'data_matrix' || format === 'aztec' || format === 'pdf417';

        // Vizuální feedback
        const resultEl = document.getElementById('scanner-result');
        resultEl.textContent = isQr ? '✓ QR KÓD NASKENOVÁN' : '✓ ČÁROVÝ KÓD NASKENOVÁN';
        resultEl.classList.add('show');

        if (window.navigator.vibrate) window.navigator.vibrate([60, 40, 60]);

        setTimeout(() => {
            closeScanner();
            document.getElementById('cardCode').value = value;
            document.getElementById('isQrToggle').checked = isQr;
        }, 700);
    }

    function showScannerFallback() {
        const resultEl = document.getElementById('scanner-result');
        resultEl.textContent = '⚠ Skener není podporován v tomto prohlížeči';
        resultEl.classList.add('show');
        setTimeout(closeScanner, 2000);
    }

    function closeScanner() {
        clearInterval(scannerInterval);
        scannerInterval = null;
        if (scannerStream) {
            scannerStream.getTracks().forEach(t => t.stop());
            scannerStream = null;
        }
        const modal = document.getElementById('scanner-modal');
        modal.style.display = 'none';
        document.getElementById('scanner-video').srcObject = null;
    }

    // ========================
    // AUTH
    // ========================
    function checkUserAuthentication() {
        const savedUser = localStorage.getItem('kotak_user');
        if (!savedUser) {
            alert("Uživatel není přihlášen! Přesměrovávám na hlavní stránku...");
            window.location.href = "app.html";
            return false;
        }
        try {
            const parsedData = JSON.parse(savedUser);
            uName = parsedData.username;
        } catch(e) {
            alert("Chyba při čtení dat uživatele. Přesměrovávám...");
            window.location.href = "app.html";
            return false;
        }
        if (!uName) { window.location.href = "app.html"; return false; }
        uName = uName.trim().toLowerCase().replace(/\s+/g, '');
        return true;
    }

    function firstLoadUserRoom() {
        if (!uName) return;
        db.ref('users/' + uName + '/cards').once('value', snap => {
            const assignedRoom = snap.val();
            if (assignedRoom) {
                startSync(assignedRoom.toString(), false);
                initUserRoomListener();
            } else {
                const defaultRoom = Math.floor(10000 + Math.random() * 90000).toString();
                startSync(defaultRoom, true);
                initUserRoomListener();
            }
        });
        if (userRoomRef) userRoomRef.off();
        userRoomRef = db.ref('users/' + uName + '/cards');
        userRoomRef.on('value', snap => {
            const assignedRoom = snap.val();
            if (assignedRoom) {
                const currentLocalRoom = localStorage.getItem('room');
                if (assignedRoom.toString() !== currentLocalRoom) {
                    startSync(assignedRoom.toString(), false);
                }
            }
        });
    }

    function initSyncManual() {
        const code = document.getElementById('syncInput').value;
        if (code.length !== 5) return alert("Zadej 5 čísel!");
        startSync(code, true);
        closeAll();
    }

    function startSync(code, writeToDatabase = true) {
        localStorage.setItem('room', code);
        if(cardsRef) cardsRef.off();
        if (writeToDatabase && uName) {
            db.ref('users/' + uName + '/cards').set(code);
        }
        cardsRef = db.ref('cards/' + code);
        cardsRef.on('value', snap => {
            if (dragEl) return;
            const data = snap.val() || {};
            cards = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a, b) => a.position - b.position);
            document.getElementById('syncLabel').innerText = "KÓD: " + code;
            renderCards();
        });
    }

    function leaveSync() {
        if (uName) db.ref('users/' + uName + '/cards').remove();
        localStorage.removeItem('room');
        location.reload();
    }

    // ========================
    // KARTY
    // ========================
    function saveCard() {
        const n = document.getElementById('cardName').value;
        const c = document.getElementById('cardCode').value;
        const q = document.getElementById('isQrToggle').checked;
        if(!n || !c) return;
        const cardType = q ? "qrcode" : "barcode";
        const nextPosition = cards.length;
        if(cardsRef) {
            cardsRef.push({ name: n, code: c, type: cardType, position: nextPosition });
        } else {
            cards.push({ name: n, code: c, type: cardType, position: nextPosition });
            renderCards();
        }
        document.getElementById('cardName').value = '';
        document.getElementById('cardCode').value = '';
        document.getElementById('isQrToggle').checked = false;
        closeAll();
    }

    function deleteCard() {
        const card = cards[currentIdx];
        if(cardsRef && card.id) {
            cardsRef.child(card.id).remove();
            setTimeout(reindexAndSaveCards, 500);
        } else {
            cards.splice(currentIdx, 1);
            renderCards();
        }
        hideDetail();
    }

    function renderCards() {
        const g = document.getElementById('card-grid'); g.innerHTML = '';
        cards.forEach((c, i) => {
            g.innerHTML += `
                <div class="tile" data-index="${i}"
                     ontouchstart="handleTouchStart(event,${i})"
                     ontouchmove="handleTouchMove(event)"
                     ontouchend="handleTouchEnd(event)">
                    <div class="tile-icon">${c.name[0].toUpperCase()}</div>
                    <div class="tile-name">${c.name}</div>
                </div>`;
        });
    }

    // ========================
    // DRAG & DROP
    // ========================
    function handleTouchStart(e, index) {
        isPressing = true; initialIndex = index;
        const touch = e.touches[0];
        startX = touch.clientX; startY = touch.clientY;
        const el = e.currentTarget;
        pressTimeout = setTimeout(() => {
            if (!isPressing) return;
            dragEl = el; dragEl.classList.add('dragging');
            if (window.navigator.vibrate) window.navigator.vibrate(40);
        }, 400);
    }

    function handleTouchMove(e) {
        if (!dragEl) { isPressing = false; clearTimeout(pressTimeout); return; }
        e.preventDefault();
        const touch = e.touches[0];
        const deltaX = touch.clientX - startX, deltaY = touch.clientY - startY;
        dragEl.style.transform = `translate(${deltaX}px,${deltaY}px) scale(1.05)`;
        const grid = document.getElementById('card-grid');
        const siblings = [...grid.querySelectorAll('.tile:not(.dragging)')];
        const target = siblings.find(s => {
            const r = s.getBoundingClientRect();
            return touch.clientX >= r.left && touch.clientX <= r.right && touch.clientY >= r.top && touch.clientY <= r.bottom;
        });
        if (target) {
            const dIdx = cards[parseInt(dragEl.getAttribute('data-index'))].position;
            const tIdx = cards[parseInt(target.getAttribute('data-index'))].position;
            if (dIdx < tIdx) grid.insertBefore(dragEl, target.nextSibling);
            else grid.insertBefore(dragEl, target);
        }
    }

    function handleTouchEnd(e) {
        isPressing = false; clearTimeout(pressTimeout);
        if (!dragEl) {
            if (initialIndex !== null) showDetail(initialIndex);
            return;
        }
        dragEl.classList.remove('dragging'); dragEl.style.transform = '';
        const grid = document.getElementById('card-grid');
        const els = [...grid.querySelectorAll('.tile')];
        let newCards = [];
        els.forEach((el, pos) => {
            let card = cards[parseInt(el.getAttribute('data-index'))];
            card.position = pos; newCards.push(card);
        });
        cards = newCards; dragEl = null; initialIndex = null;
        renderCards(); reindexAndSaveCards();
    }

    function reindexAndSaveCards() {
        if (!cardsRef) return;
        let updates = {};
        cards.forEach(card => {
            if(card.id) {
                updates[card.id + '/name'] = card.name;
                updates[card.id + '/code'] = card.code;
                updates[card.id + '/type'] = card.type;
                updates[card.id + '/position'] = card.position;
            }
        });
        db.ref('cards/' + localStorage.getItem('room')).update(updates);
    }

    // ========================
    // DETAIL
    // ========================
    function showDetail(i) {
        currentIdx = i; const c = cards[i];
        const dv = document.getElementById('detail-view');
        dv.style.display = 'flex';
        document.getElementById('det-name').innerText = c.name;
        document.getElementById('det-number').innerText = c.code;
        const bcContainer = document.getElementById('barcode-container');
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        if(c.type === "qrcode") {
            bcContainer.style.display = 'none'; qrContainer.style.display = 'flex';
            new QRCode(qrContainer, { text: c.code, width: 250, height: 250 });
        } else {
            bcContainer.style.display = 'flex'; qrContainer.style.display = 'none';
            let barWidth = c.code.length > 12 ? 1.7 : 2.5;
            if(c.code.length > 18) barWidth = 1.3;
            JsBarcode("#barcode", c.code.replace(/\s/g, ''), { format: "CODE128", width: barWidth, height: 120, displayValue: false });
        }
        setTimeout(() => dv.classList.add('active'), 10);
    }

    function hideDetail() {
        document.getElementById('detail-view').classList.remove('active');
        setTimeout(() => document.getElementById('detail-view').style.display = 'none', 400);
    }

    // ========================
    // NAVIGACE
    // ========================
    function closeAll() {
        document.querySelectorAll('.sheet').forEach(s => s.classList.remove('active'));
        document.getElementById('overlay').style.display = 'none';
    }
    function openAddCard() {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('add-sheet').classList.add('active');
    }
    function openSync() {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('sync-sheet').classList.add('active');
    }

    window.onload = () => {
        if (checkUserAuthentication()) firstLoadUserRoom();
    }
</script>
</body>
</html>
